# Read by /usr/local/bin/steam-session (restart steam-session.service after editing).
# gamepadui = Big Picture, desktop = desktop client
STEAM_UI=gamepadui
# 1 = re-expose the built-in pad as an Xbox 360 pad through uinput (padmap)
PADMAP=0
# 1 = let CEF use the GPU (Panfrost GLES); 0 = software raster
CEF_GPU=0
STEAM_EXTRA_ARGS=
# 1 = SteamOS client mode (-steamos3 -steampal -steamdeck): system settings and power menu in Steam
STEAMOS=1
# Steam DevTools port for automation (mdeck eval/targets); loopback only. Empty disables it.
CDP_PORT=8080
# 1 = tell Steam it runs under gamescope (GAMESCOPE_WAYLAND_DISPLAY), so it hands focus to games through
# mdeck-focus as on SteamOS
GAMESCOPE_COMPAT=1
# 1 = experimental: run real gamescope (llvmpipe) nested in Xorg and Steam inside it, instead of mdeck-focus
NESTED_GAMESCOPE=0
# Extra Chromium switches for Steam's web helper (the Steam UI), appended to Valve's; empty for none
WEBHELPER_EXTRA_ARGS=
# 1 = keep Valve's blurred backgrounds and panels in Steam's UI; 0 (default) turns them off, which is far cheaper without a GPU renderer
UI_BLUR=0
