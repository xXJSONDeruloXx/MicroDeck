# Sleep is off unless the boot partition has a "sleep" file (mdeck-sleep-config, `mdeck-sleep on`): waking by the power button is not yet confirmed on every unit,
# and a sleeping handheld that cannot be woken looks dead. Until then Steam's power-menu "Sleep" fails instead of freezing the handheld (docs/findings.md).
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
