# The fallback when sleep is switched off (a "nosleep" file on the boot partition, `mdeck-sleep off`): Steam's power-menu "Sleep" fails
# instead of freezing the handheld. mdeck-sleep-config writes the enabling drop-in to /run at every boot unless that file exists.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
