# FEX reserves 4-6 GB of address space per x86 process. The default heuristic refuses any single allocation larger than RAM
# plus swap (about 3 GB here), so every fork and exec of an emulated program failed with ENOMEM (`__vm_enough_memory` in
# dmesg). Always allow: the reservation is not touched until used, and earlyoom and the memory guard handle real shortage.
vm.overcommit_memory = 1
