name: build
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**.md']
  pull_request:
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/ci-checks.sh
  kernel:
    uses: ./.github/workflows/kernel.yml
  inputplumber:
    uses: ./.github/workflows/inputplumber.yml

  uboot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash uboot/build.sh card
      - run: bash uboot/build.sh fel-boot
      - run: bash uboot/build.sh fel-reset
      - uses: actions/upload-artifact@v4
        with: {name: uboot, path: out/uboot/*.bin}

  rootfs:
    needs: [kernel, inputplumber]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Pushes of main publish the base image (tools/build-rootfs.sh tags it by a hash of its inputs), so
      # local builds and later runs pull it instead of reinstalling every package.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: ROCKNIX kernel, modules and firmware
        run: bash tools/fetch-rocknix.sh
      - uses: actions/download-artifact@v4
        with: {name: kernel, path: out/dl-kernel}
      - uses: actions/download-artifact@v4
        with: {name: inputplumber, path: out/dl-inputplumber}
      - name: Our kernel (7.2.0-sxx) and InputPlumber, where the image build looks for them
        run: |
          mkdir -p cache/kernel cache/inputplumber
          tar -xJf out/dl-kernel/kernel.tar.xz -C cache/kernel
          tar -xJf out/dl-inputplumber/inputplumber.tar.xz -C cache/inputplumber
      # Release builds carry no SSH key or Wi-Fi profile: adb over USB until the user adds them.
      - run: mkdir -p secrets/nm && touch secrets/authorized_keys
      - run: bash tools/build-rootfs.sh
        env:
          PUSH_BASE: ${{ github.event_name != 'pull_request' && '1' || '0' }}
          BASE_REGISTRY: ghcr.io/${{ github.repository_owner }}/steamos-rg40xx-base
      - uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: |
            out/rootfs.tar
            cache/kernel/KERNEL
            cache/kernel/dtbs/sun50i-h700-anbernic-rg40xx-*.dtb
          retention-days: 3
          compression-level: 0

  image:
    needs: [uboot, rootfs]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: uboot, path: out/uboot}
      - uses: actions/download-artifact@v4
        with: {name: rootfs, path: .}
      - run: bash tools/build-image.sh
        env:
          SXX_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
      - run: sudo chown -R "$(id -u):$(id -g)" out && xz -T0 -6 out/steamos-rg40xx.img && (cd out && sha256sum steamos-rg40xx.img.xz | tee steamos-rg40xx.img.xz.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: |
            out/steamos-rg40xx.img.xz
            out/steamos-rg40xx.img.xz.sha256
            out/uboot/*.bin
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: |
            out/steamos-rg40xx.img.xz
            out/steamos-rg40xx.img.xz.sha256
            out/uboot/fel-boot.bin
            out/uboot/fel-reset.bin
