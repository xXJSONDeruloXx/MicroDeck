name: build
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**.md']
  pull_request:
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/ci-checks.sh
      - name: focus daemon against a real X server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc libc6-dev libx11-dev libxres-dev xvfb openbox x11-utils x11-apps xdotool procps
          bash tests/focus/run.sh
  kernel:
    uses: ./.github/workflows/kernel.yml
  inputplumber:
    uses: ./.github/workflows/inputplumber.yml

  uboot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash uboot/build.sh card
      - run: bash uboot/build.sh fel-boot
      - run: bash uboot/build.sh fel-reset
      # RG28XX: its own DRAM values (uboot/rg28xx_lpddr4_defconfig, read from its boot0)
      - run: UBOOT_DEFCONFIG=rg28xx_lpddr4_defconfig UBOOT_SUFFIX=-rg28xx bash uboot/build.sh card
      - run: UBOOT_DEFCONFIG=rg28xx_lpddr4_defconfig UBOOT_SUFFIX=-rg28xx bash uboot/build.sh fel-boot
      - uses: actions/upload-artifact@v4
        with: {name: uboot, path: out/uboot/*.bin}

  rootfs:
    needs: [kernel, inputplumber]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Pushes of main publish the base image (tools/build-rootfs.sh tags it by a hash of its inputs), so
      # local builds and later runs pull it instead of reinstalling every package.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: ROCKNIX kernel, modules and firmware
        run: for i in 1 2 3 4; do bash tools/fetch-rocknix.sh && exit 0; echo "download failed, retrying"; sleep 30; done; exit 1
      - uses: actions/download-artifact@v4
        with: {name: kernel, path: out/dl-kernel}
      - uses: actions/download-artifact@v4
        with: {name: inputplumber, path: out/dl-inputplumber}
      - name: Our kernel (7.2.0-sxx) and InputPlumber, where the image build looks for them
        run: |
          mkdir -p cache/kernel cache/inputplumber
          tar -xJf out/dl-kernel/kernel.tar.xz -C cache/kernel
          tar -xJf out/dl-inputplumber/inputplumber.tar.xz -C cache/inputplumber
      # Release builds carry no SSH key or Wi-Fi profile: adb over USB until the user adds them.
      - run: mkdir -p secrets/nm && touch secrets/authorized_keys
      - run: bash tools/build-rootfs.sh
        env:
          PUSH_BASE: ${{ github.event_name != 'pull_request' && '1' || '0' }}
          BASE_REGISTRY: ghcr.io/${{ github.repository_owner }}/steamos-rg40xx-base
      - uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: |
            out/rootfs.tar
            cache/kernel/KERNEL
            cache/kernel/dtbs/sun50i-h700-anbernic-rg40xx-*.dtb
            cache/boot/device_trees/sun50i-h700-anbernic-rg28xx.dtb
          retention-days: 3
          compression-level: 0

  image:
    needs: [uboot, rootfs]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        device: [rg40xx, rg28xx]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: uboot, path: out/uboot}
      - uses: actions/download-artifact@v4
        with: {name: rootfs, path: .}
      - run: bash tools/build-image.sh
        env:
          DEVICE: ${{ matrix.device }}
          SXX_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
      - run: sudo chown -R "$(id -u):$(id -g)" out && xz -T0 -6 out/steamos-${{ matrix.device }}.img && (cd out && sha256sum steamos-${{ matrix.device }}.img.xz | tee steamos-${{ matrix.device }}.img.xz.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.device }}
          path: |
            out/steamos-${{ matrix.device }}.img.xz
            out/steamos-${{ matrix.device }}.img.xz.sha256
            out/uboot/*.bin

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: 'image-*', path: out, merge-multiple: true}
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: |
            out/steamos-rg40xx.img.xz
            out/steamos-rg40xx.img.xz.sha256
            out/steamos-rg28xx.img.xz
            out/steamos-rg28xx.img.xz.sha256
            out/uboot/fel-boot.bin
            out/uboot/fel-reset.bin
            out/uboot/fel-boot-rg28xx.bin

  vm-boot:
    needs: image
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: image-rg40xx, path: out}
      - uses: actions/cache@v4
        with:
          path: cache/qemu/Image
          key: qemu-kernel-${{ hashFiles('tools/qemu/ci.sh') }}
      - run: bash tools/qemu/ci.sh out/steamos-rg40xx.img.xz
