name: kernel
# ROCKNIX's H700 kernel rebuilt with HIDRAW, UHID, HID_STEAM and USB/IP (kernel/build.sh). Called by the main build; the
# result is cached by a hash of its inputs, so only changes under kernel/ pay the ~15 minute compile.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  kernel:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: out
        with:
          path: out/kernel
          key: kernel-out-${{ hashFiles('kernel/**', 'tools/fetch-rocknix.sh') }}
      - if: steps.out.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential bc bison flex libssl-dev libelf-dev rsync xz-utils python3 git cpio kmod patch curl ccache
      - if: steps.out.outputs.cache-hit != 'true'
        name: ROCKNIX kernel, modules and firmware (inputs for the built-in initramfs and firmware)
        run: for i in 1 2 3 4; do bash tools/fetch-rocknix.sh && exit 0; echo "download failed, retrying"; sleep 30; done; exit 1
      - if: steps.out.outputs.cache-hit != 'true'
        run: bash kernel/build.sh
      - run: tar -C out/kernel -cf - . | xz -T0 -3 > out/kernel.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: out/kernel.tar.xz
          retention-days: 14
          compression-level: 0
